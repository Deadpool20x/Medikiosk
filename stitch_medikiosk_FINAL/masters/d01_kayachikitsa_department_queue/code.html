<script>
  function toggleEmptyState() {
    const active = document.getElementById('activeQueueContainer');
    const empty = document.getElementById('emptyQueueCard');
    const btnLabel = document.getElementById('toggleBtnLabel');
    const counter = document.getElementById('activeCounter');

    if (empty.classList.contains('hidden')) {
      active.classList.add('hidden');
      empty.classList.remove('hidden');
      empty.classList.add('flex');
      btnLabel.textContent = 'Show Active Queue';
      counter.textContent = '0 Patients Waiting';
    } else {
      empty.classList.add('hidden');
      empty.classList.remove('flex');
      active.classList.remove('hidden');
      btnLabel.textContent = 'Preview Empty State';
      counter.textContent = '4 Patients Waiting';
    }
  }
