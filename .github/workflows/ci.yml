name: MediKiosk CI

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Invariant Audit
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: "dummy-ci-groq-key"
      NVIDIA_NIM_API_KEY: "dummy-ci-nvidia-key"
      OPENROUTER_API_KEY: "dummy-ci-openrouter-key"
      DATABASE_URL: "sqlite:///./ci_test.db"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Regression Test Suite
        run: |
          pytest backend/tests -v

      - name: Run State Bypass & Clinical Safety Audit
        run: |
          python -m backend.audit

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
